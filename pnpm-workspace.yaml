# pnpm workspace/settings file. Introduced to migrate
# the dependency overrides out of package.json's legacy
# `pnpm` block, which pnpm >= 11 no longer reads. Keeping
# the pins here keeps the supply-chain overrides enforced
# by the lockfile for local installs and CI alike.
allowBuilds:
  # esbuild, core-js and core-js-pure ship postinstall
  # scripts; on modern pnpm they are blocked by default,
  # so they must be explicitly allowlisted or frozen
  # installs fail.
  esbuild: true
  core-js: true
  core-js-pure: true

overrides:
  '@babel/runtime': 7.26.10
  '@eslint/plugin-kit': 0.3.4
  '@tootallnate/once': 3.0.1
  ajv@6.12.6: 6.14.0
  brace-expansion@2.0.2: 2.0.3
  esbuild: 0.25.0
  flatted: 3.4.2
  lodash: 4.18.0
  minimatch@3.0.8: 3.1.5
  minimatch@3.1.2: 3.1.5
  picomatch@2.3.1: 2.3.2
  picomatch@4.0.3: 4.0.4
  send: 0.19.0
  yaml: 1.10.3
